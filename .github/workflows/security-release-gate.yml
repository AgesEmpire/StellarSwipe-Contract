name: Security Release Gate

# Named, auditable release-safety gate (Issue #886). Deliberately overlaps
# with the `Format check` / `Clippy` / `Tests` steps in ci.yml — the point of
# this workflow is to be a distinct, clearly-labeled check that blocks merges
# into main and blocks release tags on unsafe changes, independent of
# whatever else ci.yml happens to run. See docs/security/release_security_checklist.md
# for the human-review half of this gate that this workflow enforces the
# presence of.

on:
  pull_request:
    branches: [ main ]
  push:
    tags:
      - 'v*'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  STELLAR_NETWORK: testnet

jobs:
  security-release-gate:
    runs-on: ubuntu-latest

    steps:
      # Safety: ensure mainnet config is never loaded in CI
      - name: Guard — reject mainnet in CI
        run: |
          if [ "${STELLAR_NETWORK}" = "mainnet" ]; then
            echo "ERROR: STELLAR_NETWORK=mainnet is not allowed in CI" && exit 1
          fi

      - uses: actions/checkout@v4

      # The human-review half of this gate lives in
      # docs/security/release_security_checklist.md. Fail loudly if it is
      # ever deleted so the automated and human halves of the gate stay
      # connected — see .github/pull_request_template.md, which links
      # reviewers to this file on every contract-touching PR.
      - name: Verify release security checklist exists
        run: test -f docs/security/release_security_checklist.md

      # Deployment manifests (deployments/*.manifest.json) describe required
      # addresses, contract versions, and cross-contract dependencies for a
      # release. Validate them before anything else so a misconfigured
      # manifest fails fast, cheaply, and before any build/test work.
      - name: Validate deployment manifests
        run: python3 stellar-swipe/scripts/validate_deployment_manifest.py

      # Upgrade compatibility manifests (Issue #1102) capture the storage
      # layout, interface version, and upgrade prerequisites for each
      # contract release. Generate them from the current sources and fail
      # the gate if a committed manifest is missing or incompatible with
      # the candidate build, so operators can diff deployed vs. candidate
      # versions before upgrading.
      - name: Generate upgrade compatibility manifests
        run: python3 stellar-swipe/scripts/generate_compatibility_manifest.py --out-dir deployments/compatibility

      - name: Check upgrade compatibility manifests
        run: |
          python3 stellar-swipe/scripts/check_compatibility_manifest.py \
            --manifest-dir deployments/compatibility
          rc=$?
          if [ $rc -eq 1 ]; then
            echo "ERROR: upgrade compatibility manifest missing or incompatible — see output above." >&2
            exit 1
          fi

      # Setup Rust toolchain with required components and target
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      # Cache dependencies for faster builds
      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: stellar-swipe

      # Format check for entire workspace
      - name: Format check
        run: cd stellar-swipe && cargo fmt --all -- --check

      # Clippy: any warning blocks the release gate.
      - name: Clippy
        run: cd stellar-swipe && cargo clippy --workspace --all-targets -- -D warnings

      # Run tests for all workspace crates
      - name: Tests
        run: cd stellar-swipe && cargo test --workspace --all-targets

      # Guard against renumbering or reusing #[contracterror] discriminants.
      # Exit 0 = clean; exit 2 = new codes added (baseline auto-updated, not
      # a gate failure — see the script's own docstring); exit 1 =
      # renumbering/reuse detected -> fail the build.
      - name: Check error code baselines
        run: |
          python3 stellar-swipe/scripts/check_error_codes.py
          rc=$?
          if [ $rc -eq 1 ]; then
            echo "ERROR: error code violation detected — see output above." >&2
            exit 1
          fi
          if [ $rc -eq 2 ]; then
            echo "INFO: new error codes added; baseline updated locally."
            echo "This is not a gate failure — commit the updated stellar-swipe/error-baselines/*.json files."
          fi

      # WASM reproducibility check (Issue #1083). Build the contract WASM
      # twice from the same source under the pinned toolchain and locked
      # dependencies, then compare the resulting hashes. Any difference means
      # the release artifact is not reproducible and the gate fails with
      # actionable diagnostics (hashes, artifact paths, toolchain, lock state).
      - name: WASM reproducibility check
        run: |
          set -euo pipefail
          cd stellar-swipe

          # Capture the toolchain, target, and dependency lock state used for
          # the build so a hash mismatch can be investigated later.
          echo "=== Build environment ==="
          rustc --version | tee /tmp/repro-env.txt
          cargo --version | tee -a /tmp/repro-env.txt
          echo "target: wasm32-unknown-unknown" | tee -a /tmp/repro-env.txt
          echo "lockfile: Cargo.lock" | tee -a /tmp/repro-env.txt
          if [ -f Cargo.lock ]; then
            sha256sum Cargo.lock | tee -a /tmp/repro-env.txt
          else
            echo "ERROR: Cargo.lock is missing — locked dependencies are required for reproducible builds." >&2
            exit 1
          fi

          # Build the contract WASM twice from the same source. The second
          # build reuses the same toolchain, target, and lockfile; identical
          # hashes prove the output is reproducible.
          build_wasm() {
            local out_dir="$1"
            rm -rf "$out_dir"
            mkdir -p "$out_dir"
            cargo build --release --locked --target wasm32-unknown-unknown \
              -p signal_registry
            cp target/wasm32-unknown-unknown/release/signal_registry.wasm "$out_dir/"
          }

          build_wasm /tmp/repro-build-1
          build_wasm /tmp/repro-build-2

          hash1=$(sha256sum /tmp/repro-build-1/signal_registry.wasm | awk '{print $1}')
          hash2=$(sha256sum /tmp/repro-build-2/signal_registry.wasm | awk '{print $1}')

          echo "=== Reproducibility result ==="
          echo "build 1: $hash1  (/tmp/repro-build-1/signal_registry.wasm)"
          echo "build 2: $hash2  (/tmp/repro-build-2/signal_registry.wasm)"

          if [ "$hash1" != "$hash2" ]; then
            echo "" >&2
            echo "ERROR: contract WASM is not reproducible — hashes differ." >&2
            echo "  build 1: $hash1" >&2
            echo "  build 2: $hash2" >&2
            echo "" >&2
            echo "Build environment (toolchain, target, lock state):" >&2
            cat /tmp/repro-env.txt >&2
            echo "" >&2
            echo "See docs/security/release_security_checklist.md for how to" >&2
            echo "investigate hash differences." >&2
            exit 1
          fi

          echo "OK: contract WASM hashes match ($hash1)."

      # Contract release artifact manifest validation (Issue #1168). Every
      # deployable Soroban WASM artifact must have a matching contract name,
      # interface version, checksum, and source revision before release.
      # Generate a manifest from the built artifacts, then verify it against
      # the artifacts on disk so incomplete or mismatched manifests and
      # tampered WASM (checksum mismatch) fail the gate.
      - name: Generate contract release artifact manifest
        run: |
          python3 stellar-swipe/scripts/generate_release_manifest.py \
            --artifact-dir stellar-swipe/target/wasm32-unknown-unknown/release \
            --out deployments/release_manifest.json

      - name: Validate contract release artifact manifest
        run: |
          python3 stellar-swipe/scripts/validate_release_manifest.py \
            --manifest deployments/release_manifest.json \
            --artifact-dir stellar-swipe/target/wasm32-unknown-unknown/release
          rc=$?
          if [ $rc -eq 1 ]; then
            echo "ERROR: contract release artifact manifest is incomplete or mismatched — see output above." >&2
            echo "See docs/security/release_security_checklist.md for the verification command." >&2
            exit 1
          fi
