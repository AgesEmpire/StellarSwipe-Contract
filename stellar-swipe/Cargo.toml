[workspace]
resolver = "2"
members = [
  "contracts/common",
  "contracts/signal_registry",
  "contracts/auto_trade",
  "contracts/trade_executor",
  "contracts/governance",
  "contracts/oracle",
  "contracts/stake_vault",
  "contracts/shared",
  "contracts/fee_collector",
  "contracts/user_portfolio",
  "contracts/analytics",
  "contracts/integration_tests",
  "contracts/bridge",
  "contracts/stake_vault_kani",
]

[workspace.dependencies]
soroban-sdk = "23"

[workspace.lints.rust]
deprecated = "allow"
dead_code = "allow"
unused_imports = "allow"
unused_variables = "allow"
unused_mut = "allow"
unreachable_patterns = "allow"
private_interfaces = "allow"
private_bounds = "allow"
unused_qualifications = "allow"
unused_must_use = "allow"
unused_assignments = "allow"
unused_parens = "allow"
unused_braces = "allow"
unused_lifetimes = "allow"
unused_macro_rules = "allow"
unused_allocation = "allow"
unused_comparisons = "allow"
unused_doc_comments = "allow"
unused_crate_dependencies = "allow"
unused_extern_crates = "allow"
unused_features = "allow"
unused_labels = "allow"
unused_results = "allow"
unused_unsafe = "allow"
non_camel_case_types = "allow"
unexpected_cfgs = { level = "allow", check-cfg = ['cfg(kani)'] }

[workspace.lints.clippy]
# Soroban contract entry-points routinely exceed Clippy's 7-argument
# threshold because the host environment requires explicit argument passing
# (no struct wrappers in the public ABI).  Applies workspace-wide because
# every contract crate is affected equally.
too_many_arguments = "allow"
# Module names matching their parent (e.g. `mod errors { … ContractError }`)
# are idiomatic in Soroban crates where each module owns one type.
module_inception = "allow"
# Soroban storage accessors return raw values and callers are expected to
# handle the None case at the call site; map_or / unwrap_or patterns are
# preferred over question-mark propagation through Option.
option_if_let_else = "allow"
# The existing contract workspace predates the current default clippy style
# set. Keep CI focused on type checking and behavior while issue PRs avoid
# broad, ABI-neutral style rewrites.
absurd_extreme_comparisons = "allow"
assign_op_pattern = "allow"
cast_abs_to_unsigned = "allow"
clone_on_copy = "allow"
collapsible_if = "allow"
collapsible_match = "allow"
doc_lazy_continuation = "allow"
double_parens = "allow"
empty_line_after_doc_comments = "allow"
enum_variant_names = "allow"
explicit_auto_deref = "allow"
if_same_then_else = "allow"
inconsistent_digit_grouping = "allow"
len_zero = "allow"
let_and_return = "allow"
let_unit_value = "allow"
manual_clamp = "allow"
manual_contains = "allow"
manual_is_multiple_of = "allow"
manual_range_contains = "allow"
needless_borrow = "allow"
needless_borrows_for_generic_args = "allow"
needless_question_mark = "allow"
needless_range_loop = "allow"
only_used_in_recursion = "allow"
redundant_closure = "allow"
unnecessary_cast = "allow"
unnecessary_min_or_max = "allow"
upper_case_acronyms = "allow"

# Smaller WASM for Soroban deploys (lower upload cost + instruction footprint).
# Build:  cargo build --workspace --target wasm32-unknown-unknown --release
# Then:   ./scripts/build.sh   (runs `stellar contract optimize` on each *.wasm)
[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
