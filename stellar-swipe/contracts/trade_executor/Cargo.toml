[package]
name = "trade_executor"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
crate-type = ["lib", "cdylib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }
stellar_swipe_common = { path = "../common" }
shared = { path = "../shared" }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
# Required so the `#[cfg_attr(test, derive(soroban_sdk::testutils::arbitrary::Arbitrary))]`
# on ContractError can resolve the `::arbitrary` paths emitted by the derive macro.
arbitrary = { version = "1", features = ["derive"] }
proptest = { version = "1", default-features = false, features = ["std"] }

[lints]
workspace = true
