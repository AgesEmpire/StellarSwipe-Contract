[package]
name = "stake_vault"
version = "0.1.0"
edition = "2021"
description = "Stake vault Soroban smart contract"
license = "MIT"
repository = "https://github.com/HandsOff/contracts"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { version = "21.0.0" }

[dev-dependencies]
soroban-sdk = { version = "21.0.0", features = ["testutils"] }

[profile.release]
opt-level = "z"
overflow-checks = true
lto = true
debug = false
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
