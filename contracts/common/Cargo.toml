[package]
name = "stellar_swipe_liquidity_pool"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
path = "src/liquidity_pool.rs"
crate-type = ["lib"]

[workspace]

[features]
testutils = ["soroban-sdk/testutils"]

[dependencies]
soroban-sdk = { version = "23", features = [] }

[dev-dependencies]
soroban-sdk = { version = "23", features = ["testutils"] }

[[bench]]
name = "batch_authorization"
harness = false

# Release WASM artifact size ceiling (issue #1193).
# The release build enforces a documented maximum optimized artifact size so
# unexpectedly large WASM artifacts cannot silently increase deployment cost
# or hide dependency growth. Update the value below to change the ceiling;
# the change is a single, reviewable line.
[package.metadata.wasm-size-ceiling]
# Maximum allowed size of the optimized release WASM artifact, in bytes.
max-bytes = 65536
# Human-readable form of the ceiling, kept in sync with `max-bytes`.
max-human = "64 KiB"
