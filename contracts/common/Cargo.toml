[package]
name = "common"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }

[[test]]
name = "token_transfer_authorization"
path = "tests/token_transfer_authorization.rs"

[[test]]
name = "token_response_compatibility"
path = "tests/token_response_compatibility.rs"

[[test]]
name = "swap"
path = "tests/swap.rs"

[[test]]
name = "swap_fee"
path = "tests/swap_fee.rs"

[[test]]
name = "liquidity_deposit_withdrawal"
path = "tests/liquidity_deposit_withdrawal.rs"

[[bench]]
name = "batch_authorization"
harness = false

# Release WASM artifact size ceiling (issue #1193).
# The release build enforces a documented maximum optimized artifact size so
# unexpectedly large WASM artifacts cannot silently increase deployment cost
# or hide dependency growth. Update the value below to change the ceiling;
# the change is a single, reviewable line.
[package.metadata.wasm-size-ceiling]
# Maximum allowed size of the optimized release WASM artifact, in bytes.
max-bytes = 65536
# Human-readable form of the ceiling, kept in sync with `max-bytes`.
max-human = "64 KiB"
